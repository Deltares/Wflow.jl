# HydroMT-Wflow workflow for the Moselle sbm test model.
#
# Exported to staticmaps-moselle.nc and forcing-moselle.nc, and the forcing of the
# Wflow run that produces the sediment model forcing (see ../runs). Steps prefixed with
# `testdata.` are custom steps (../testdata.py), all other steps are HydroMT-Wflow methods.
modeltype: wflow_sbm
global:
  data_libs:
    - ../data_catalog.yml

steps:
  - setup_config:
      data:
        time.starttime: 1999-12-29T00:00:00
        time.endtime: 2001-01-01T00:00:00
        time.timestepsecs: 86400

  - setup_basemaps:
      region:
        subbasin: [7.585, 50.3675]  # Moselle at Koblenz
        uparea: 20000
        bounds: [5.3, 47.7, 8.0, 50.5]
      hydrography_fn: merit_hydro
      basin_index_fn: merit_hydro_index
      res: 0.008333333333333333
      upscale_method: ihu

  # local inertial routing adds the bankfull elevation (RiverZ), the routing scheme of
  # the tests is set in the TOML files
  - setup_rivers:
      hydrography_fn: merit_hydro
      river_geom_fn: hydro_rivers_lin
      river_upa: 30
      rivdph_method: powlaw
      min_rivdph: 1
      min_rivwth: 30
      slope_len: 2000
      smooth_len: 5000
      river_routing: local_inertial

  - setup_river_roughness:

  - setup_floodplains:
      hydrography_fn: merit_hydro
      floodplain_type: 1d
      flood_depths: [0.5, 1.0, 1.5, 2.0, 2.5]

  - setup_floodplains:
      hydrography_fn: merit_hydro
      floodplain_type: 2d

  # the 2D floodplain step links the bankfull elevation to its D4 conditioned elevation
  - setup_config:
      data:
        input.static.river_bank_water__elevation: river_bank_elevation

  - setup_reservoirs_simple_control:
      reservoirs_fn: hydro_reservoirs
      min_area: 1.0

  - setup_lulcmaps:
      lulc_fn: globcover
      lulc_mapping_fn: globcover_mapping_default
      lulc_vars:
        - landuse
        - vegetation_kext
        - land_manning_n
        - soil_compacted_fraction
        - vegetation_root_depth
        - vegetation_leaf_storage
        - vegetation_wood_storage
        - land_water_fraction

  - setup_laimaps:
      lai_fn: modis_lai

  - setup_soilmaps:
      soil_fn: soilgrids
      ptf_ksatver: brakensiek
      wflow_thicknesslayers: [100, 300, 800]

  - setup_outlets:
      river_only: true
      toml_output: null

  - setup_gauges:
      gauges_fn: grdc
      snap_to_river: true
      derive_subcatch: false
      toml_output: null

  - setup_precip_forcing:
      precip_fn: era5

  - setup_temp_pet_forcing:
      temp_pet_fn: era5
      pet_method: debruin
      press_correction: true
      temp_correction: true
      dem_forcing_fn: era5_orography

  # wind and net radiation forcing for the land surface temperature model (sbm_lst_config.toml),
  # from hourly ERA5 on the Deltares P drive (../data_catalog.yml), FAO-56 net radiation
  - testdata.setup_lst_forcing:

  - testdata.setup_lst_parameters:
      mapping_fn: ../lst_mapping.csv

  - setup_constant_pars:
      atmosphere_air__snowfall_temperature_threshold: 0.0
      atmosphere_air__snowfall_temperature_interval: 2.0
      snowpack__melting_temperature_threshold: 0.0
      snowpack__degree_day_coefficient: 3.75653
      snowpack__liquid_water_holding_capacity: 0.1
      soil_surface_water__infiltration_reduction_parameter: 0.038
      vegetation_canopy_water__mean_evaporation_to_mean_precipitation_ratio: 0.11
      compacted_soil_surface_water__infiltration_capacity: 5.0
      soil_water_saturated_zone_bottom__max_leakage_volume_flux: 0.0
      soil_wet_root__sigmoid_function_shape_parameter: -500.0
      subsurface_water__horizontal_to_vertical_saturated_hydraulic_conductivity_ratio: 100.0

  # river boundary condition at the outlet for local inertial routing (Wflow/test/run_sbm.jl)
  - setup_config:
      data:
        input.static.model_boundary_condition_river__length.value: 1000.0
        input.static.model_boundary_condition_river_bank_water__depth.value: 2.0

  # layered vertical saturated hydraulic conductivity (soil layers [100, 300, 800] mm)
  - testdata.setup_layered_map:
      std_name: soil_layer_water__vertical_saturated_hydraulic_conductivity
      sources:
        - meta_soilgrids_ksat_vertical_15.0cm
        - meta_soilgrids_ksat_vertical_30.0cm
        - meta_soilgrids_ksat_vertical_100.0cm
        - meta_soilgrids_ksat_vertical_200.0cm

  # additional pits that split the basin (Wflow/test/run_sbm.jl)
  - testdata.setup_point_map:
      std_name: basin_pit_location__mask
      snap_to: river
      points:
        - [6.593333, 49.709167, 1]
        - [6.201667, 49.1425, 1]

  # external inflow (Wflow/test/run_sbm.jl)
  - testdata.setup_point_timeseries:
      std_name: river_water__external_inflow_volume_flow_rate
      x: 6.818333
      y: 47.959167
      snap_to: river
      length: 366
      segments: [[0, 0.75], [31, 0.5], [91, 0.0], [121, 1.5], [305, 0.5]]

  - testdata.setup_point_timeseries:
      std_name: reservoir_water__external_inflow_volume_flow_rate
      x: 5.918333
      y: 49.909167
      snap_to: reservoir_outlet
      values: [-1, -1, -1, -1, -2, -3, -3, -3, -2, -1, -1, -1]
