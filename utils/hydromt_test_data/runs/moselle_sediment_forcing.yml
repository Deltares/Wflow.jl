# Wflow sbm run (cold start) whose gridded output is the forcing of the Moselle sediment
# model (forcing-moselle-sed.nc, 2000-01-01 to 2000-02-01).
extends: sbm_config
config:
  dir_input: "{output}/test/data/input"
  dir_output: "{output}/runs/moselle_sediment_forcing"
  input.path_forcing: "{output}/runs/data/forcing-moselle-sediment-run.nc"
  time.starttime: 1999-12-31T00:00:00
  time.endtime: 2000-02-01T00:00:00
  model.cold_start__flag: true
  output.netcdf_grid:
    path: output.nc
    variables:
      atmosphere_water__precipitation_volume_flux: P
      vegetation_canopy_water__interception_volume_flux: int
      land_surface_water__depth: levKinL
      land_surface_water__volume_flow_rate: runL
      river_water__depth: h
      river_water__volume_flow_rate: q
remove: [state.path_input, state.path_output, output.netcdf_scalar, output.csv, API]
products:
  - from: output.nc
    to: forcing-moselle-sed.nc
