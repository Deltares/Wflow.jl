model: moselle_sbm
inputs:
  input: [basin__local_drain_direction, river_location__mask, reservoir_area__count, reservoir_location__count, subbasin_location__count]
  forcing: [atmosphere_water__precipitation_volume_flux, land_surface_water__potential_evaporation_volume_flux, atmosphere_air__temperature]
  static: [atmosphere_air__snowfall_temperature_threshold, atmosphere_air__snowfall_temperature_interval, land_water_covered__area_fraction, snowpack__melting_temperature_threshold, snowpack__degree_day_coefficient, soil_layer_water__brooks_corey_exponent, soil_surface_water__infiltration_reduction_parameter, soil_surface_water__vertical_saturated_hydraulic_conductivity, soil_water__vertical_saturated_hydraulic_conductivity_scale_parameter, compacted_soil_surface_water__infiltration_capacity, soil_water__residual_volume_fraction, soil_water__saturated_volume_fraction, soil_water_saturated_zone_bottom__max_leakage_volume_flux, compacted_soil__area_fraction, soil_wet_root__sigmoid_function_shape_parameter, soil__thickness, vegetation_canopy_water__mean_evaporation_to_mean_precipitation_ratio, vegetation_canopy__light_extinction_coefficient, vegetation__specific_leaf_storage, vegetation_wood_water__storage_capacity, vegetation_root__depth, river__length, river_water_flow__manning_n_parameter, river_bottom_surface__slope, river__width, land_surface_water_flow__manning_n_parameter, land_surface__slope, land_surface__elevation, reservoir_surface__area, reservoir_water_demand__required_downstream_volume_flow_rate, reservoir_water_release_below_spillway__max_volume_flow_rate, reservoir_water__max_volume, reservoir_water__target_full_volume_fraction, reservoir_water__target_min_volume_fraction, reservoir_water_surface__initial_elevation, reservoir_water__rating_curve_type_count, reservoir_water__storage_curve_type_count, subsurface_water__horizontal_to_vertical_saturated_hydraulic_conductivity_ratio, subsurface_bottom_surface__slope]
  cyclic: [vegetation__leaf_area_index]
config:
  dir_input: data/input
  dir_output: data/output
  time.endtime: 2000-01-10T00:00:00
  logging.loglevel: info
  input.path_forcing: forcing-moselle.nc
  input.path_static: staticmaps-moselle.nc
  model.soil_layer__thickness: [100, 300, 800]
  model.type: sbm
  output.csv.path: output_moselle_simple.csv
  output.csv.column:
    - coordinate:
        x: 7.378
        "y": 50.204
      header: Q
      parameter: river_water__volume_flow_rate
    - header: recharge
      parameter: soil_water_saturated_zone_top__recharge_volume_flux
      reducer: mean
