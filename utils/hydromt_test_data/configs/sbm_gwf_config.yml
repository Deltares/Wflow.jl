model: null
config:
  dir_input: data/input
  dir_output: data/output
  time.calendar: proleptic_gregorian
  time.endtime: 2000-06-30T00:00:00
  time.starttime: 2000-05-31T00:00:00
  time.time_units: "days since 1900-01-01 00:00:00"
  time.timestepsecs: 86400
  state.path_input: instates-example-sbm-gwf.nc
  state.path_output: outstates-example-sbm-gwf.nc
  state.variables.vegetation_canopy_water__depth: canopystorage
  state.variables.soil_water_saturated_zone__depth: satwaterdepth
  state.variables.soil_layer_water_unsaturated_zone__depth: ustorelayerdepth
  state.variables.river_water__depth: h_river
  state.variables.river_water__instantaneous_volume_flow_rate: q_river
  state.variables.land_surface_water__instantaneous_volume_flow_rate: q_land
  state.variables.land_surface_water__depth: h_land
  state.variables.subsurface_water__hydraulic_head: head
  input.path_forcing: forcing-sbm-groundwater-part*.nc
  input.path_static: staticmaps-sbm-groundwater.nc
  input.basin__local_drain_direction: wflow_ldd
  input.river_location__mask: wflow_river
  input.subbasin_location__count: wflow_subcatch
  input.forcing.atmosphere_water__precipitation_volume_flux: P
  input.forcing.land_surface_water__potential_evaporation_volume_flux: PET
  input.static.soil_surface_water__vertical_saturated_hydraulic_conductivity: kv
  input.static.soil_water__vertical_saturated_hydraulic_conductivity_scale_parameter:
    value: 0.001
  input.static.soil_layer_water__brooks_corey_exponent:
    value: [10.0, 10.0, 10.0, 10.0]
  input.static.soil_water__residual_volume_fraction: thetaR
  input.static.soil_water__saturated_volume_fraction: thetaS
  input.static.compacted_soil__area_fraction: PathFrac
  input.static.soil__thickness: soilthickness
  input.static.vegetation_canopy_water__mean_evaporation_to_mean_precipitation_ratio: EoverR
  input.static.vegetation_root__depth: rootingdepth
  input.static.vegetation_canopy__gap_fraction: canopygapfraction
  input.static.vegetation_water__storage_capacity: cmax
  input.static.river__length: wflow_riverlength
  input.static.river_water_flow__manning_n_parameter: N_river
  input.static.river_bottom_surface__slope: RiverSlope
  input.static.river__width: wflow_riverwidth
  input.static.land_surface_water_flow__manning_n_parameter: "N"
  input.static.land_surface__elevation: wflow_dem
  input.static.land_surface__slope: Slope
  input.static.subsurface_surface_water__horizontal_saturated_hydraulic_conductivity: k
  input.static.model_constant_boundary_condition__hydraulic_head: constant_head
  input.static.land_drain_location__mask: drain
  input.static.land_drain__conductance: cond_drain
  input.static.land_drain__elevation: elev_drain
  input.static.river_bottom__elevation: river_bottom
  input.static.river_water__infiltration_conductance: infiltration_conductance
  input.static.river_water__exfiltration_conductance: infiltration_conductance
  model.constanthead__flag: true
  model.drain__flag: true
  model.kinematic_wave__adaptive_time_step_flag: true
  model.cold_start__flag: true
  model.cell_length_in_meter__flag: true
  model.snow__flag: false
  model.soil_layer__thickness: [100, 300, 800]
  model.type: sbm_gwf
  output.netcdf_grid.path: output_example-sbm-gwf.nc
  output.netcdf_grid.variables.vegetation_canopy_water__depth: canopystorage
  output.netcdf_grid.variables.soil_water_saturated_zone__depth: satwaterdepth
  output.netcdf_grid.variables.soil_layer_water_unsaturated_zone__depth: ustorelayerdepth
  output.netcdf_grid.variables.land.soil.parameters.soil_thickness: soilthickness
  output.netcdf_grid.variables.river_water__volume_flow_rate: q_av
  output.netcdf_grid.variables.subsurface_water__hydraulic_head: head
  output.netcdf_grid.variables.subsurface_water_saturated_zone_top__net_recharge_volume_flow_rate: rate
  output.netcdf_grid.variables.land_drain_water__to_subsurface_volume_flow_rate: drain_flux
  output.netcdf_grid.variables.river_water__to_subsurface_volume_flow_rate: flux
  output.csv.path: output_example-sbm-gwf.csv
  output.csv.column:
    - header: Q_av
      index: 5
      parameter: river_water__volume_flow_rate
    - header: head
      index: 5
      parameter: subsurface_water__hydraulic_head
