model: moselle_sbm
inputs:
  input: [river_gauge__count, basin__local_drain_direction, river_location__mask, reservoir_area__count, reservoir_location__count, subbasin_location__count]
  forcing: [atmosphere_water__precipitation_volume_flux, land_surface_water__potential_evaporation_volume_flux, atmosphere_air__temperature]
  static: [atmosphere_air__snowfall_temperature_threshold, atmosphere_air__snowfall_temperature_interval, land_water_covered__area_fraction, snowpack__melting_temperature_threshold, snowpack__degree_day_coefficient, soil_layer_water__brooks_corey_exponent, soil_surface_water__infiltration_reduction_parameter, soil_surface_water__vertical_saturated_hydraulic_conductivity, soil_water__vertical_saturated_hydraulic_conductivity_scale_parameter, compacted_soil_surface_water__infiltration_capacity, soil_water__residual_volume_fraction, soil_water__saturated_volume_fraction, soil_water_saturated_zone_bottom__max_leakage_volume_flux, compacted_soil__area_fraction, soil_wet_root__sigmoid_function_shape_parameter, soil__thickness, vegetation_canopy_water__mean_evaporation_to_mean_precipitation_ratio, vegetation_canopy__light_extinction_coefficient, vegetation__specific_leaf_storage, vegetation_wood_water__storage_capacity, vegetation_root__depth, river__length, river_water_flow__manning_n_parameter, river_bottom_surface__slope, river__width, river_bank_water__depth, river_bank_water__elevation, land_surface_water_flow__manning_n_parameter, land_surface_water_flow__ground_elevation, land_surface__slope, land_surface__elevation, reservoir_surface__area, reservoir_water_demand__required_downstream_volume_flow_rate, reservoir_water_release_below_spillway__max_volume_flow_rate, reservoir_water__max_volume, reservoir_water__target_full_volume_fraction, reservoir_water__target_min_volume_fraction, reservoir_water_surface__initial_elevation, reservoir_water__rating_curve_type_count, reservoir_water__storage_curve_type_count, subsurface_water__horizontal_to_vertical_saturated_hydraulic_conductivity_ratio, subsurface_bottom_surface__slope]
  cyclic: [vegetation__leaf_area_index]
config:
  dir_input: data/input
  dir_output: data/output
  time.calendar: proleptic_gregorian
  time.endtime: 2000-02-01T00:00:00
  time.starttime: 2000-01-01T00:00:00
  time.time_units: "days since 1900-01-01 00:00:00"
  time.timestepsecs: 86400
  state.variables.vegetation_canopy_water__depth: canopystorage
  state.variables.soil_water_saturated_zone__depth: satwaterdepth
  state.variables.soil_surface__temperature: tsoil
  state.variables.soil_layer_water_unsaturated_zone__depth: ustorelayerdepth
  state.variables.snowpack_dry_snow__leq_depth: snow
  state.variables.snowpack_liquid_water__depth: snowwater
  state.variables.river_water__depth: h_river
  state.variables.river_water__instantaneous_volume_flow_rate: q_river
  state.variables.reservoir_water_surface__elevation: waterlevel_reservoir
  state.variables.subsurface_water__instantaneous_volume_flow_rate: ssf
  state.variables.land_surface_water__depth: h_land
  state.variables.land_surface_water__x_component_of_instantaneous_volume_flow_rate: qx_land
  state.variables.land_surface_water__y_component_of_instantaneous_volume_flow_rate: qy_land
  input.path_forcing: forcing-moselle.nc
  input.path_static: staticmaps-moselle.nc
  model.kinematic_wave__adaptive_time_step_flag: true
  model.snow_gravitational_transport__flag: true
  model.cold_start__flag: true
  model.reservoir__flag: true
  model.snow__flag: true
  model.soil_layer__thickness: [100, 300, 800]
  model.river_routing: local_inertial
  model.land_routing: local_inertial
  model.type: sbm
  output.netcdf_grid.path: output_moselle_swf.nc
  output.netcdf_grid.variables.soil_water_saturated_zone__depth: satwaterdepth
  output.netcdf_grid.variables.soil_surface__temperature: tsoil
  output.netcdf_grid.variables.soil_layer_water_unsaturated_zone__depth: ustorelayerdepth
  output.netcdf_grid.variables.snowpack_dry_snow__leq_depth: snow
  output.netcdf_grid.variables.snowpack_liquid_water__depth: snowwater
  output.netcdf_grid.variables.river_water__depth: hav_river
  output.netcdf_grid.variables.river_water__volume_flow_rate: qav_river
  output.netcdf_grid.variables.reservoir_water__volume: volume_reservoir
  output.netcdf_grid.variables.subsurface_water__volume_flow_rate: ssf_av
  output.netcdf_grid.variables.land_surface_water__depth: h_land
  output.netcdf_grid.variables.land.interception.variables.canopy_storage: canopystorage
  output.csv.path: output_moselle_swf.csv
  output.csv.column:
    - header: Q
      map: river_gauge__count
      parameter: river_water__volume_flow_rate
