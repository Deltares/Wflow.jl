[workspace]
name = "Wflow.jl"
authors = [
	"Joost Buitink <joost.buitink@deltares.nl>",
	"Willem van Verseveld <willem.vanVerseveld@deltares.nl>",
	"Hofer-Julian <julian.hofer@deltares.nl>",
	"Bart de Koning <bart.dekoning@deltares.nl>",
]
channels = ["conda-forge", "https://prefix.dev/julia-forge"]
platforms = ["win-64", "linux-64", "osx-arm64"]

[tasks]
# Installation
# Julia
# Note: this is for developers to have their global julia use the right version.
# Use `pixi run julia` for the package used by CI.
install-julia = "juliaup add 1.12.7 && juliaup override set 1.12.7"
# Prek
_prek-install = "prek install --overwrite"
instantiate-formatting = { cmd = "julia --project=utils/formatting --eval 'using Pkg; Pkg.instantiate()'" }
install-prek = { depends-on = [
    "_prek-install",
    "instantiate-formatting",
] }
check = "prek run --all-files"
# First one can fix issues, second one is to check if all are fixed
fix-check = "prek run --all-files || prek run --all-files"
update-manifest-julia = "julia --project utils/update-manifest.jl"
install = { depends-on = ["install-prek"] }
# Test data
download-test-data = { cmd = "dvc pull", cwd = ".", env = { CRYPTOGRAPHY_OPENSSL_NO_LEGACY = "1" } }
# Build
build-wflow-cli = { cmd = "julia --project create_app.jl", cwd = "build/create_binaries", depends-on = [
	{ "task" = "instantiate-julia", "args" = [
		"build/create_binaries",
	] },
	"download-test-data",
] }
# Test
test-wflow-cli = { cmd = "julia --project --eval 'include(\"runtests.jl\")'", cwd = "build/wflow_cli/test", depends-on = [
	{ "task" = "instantiate-julia", "args" = [
		"build/wflow_cli/test",
	] },
	"download-test-data",
] }
test-wflow-cov = { cmd = "julia --project --eval 'using Pkg; Pkg.test(allow_reresolve=false, coverage=true, julia_args=[\"--check-bounds=yes\"])'", cwd = "Wflow", depends-on = [
	{ "task" = "instantiate-julia", "args" = [
		"Wflow",
	] },
	"download-test-data",
] }
# Server
test-wflow-server = { cmd = "julia --project=server --eval 'using Pkg; Pkg.test(\"WflowServer\", allow_reresolve=false, coverage=true)'", depends-on = [
	{ "task" = "instantiate-julia", "args" = [
		"server",
	] },
	"download-test-data",
] }
# Docs
quarto-check = { cmd = "quarto check all" }
quarto-render = { cmd = "julia --project=docs --eval 'using Pkg; Pkg.build(\"IJulia\")' && quarto render docs --to html --execute" }
quarto-preview = { cmd = "quarto preview docs" }
# Parameter metadata JSON generation
parameter_metadata_json_gen = { cmd = "julia --project=utils/export_parameter_data utils/export_parameter_data/export_parameter_data.jl" }

[tasks.instantiate-julia]
args = [{ "arg" = "cwd", "default" = "." }]
cmd = "julia --project={{cwd}} --eval='using Pkg; Pkg.Registry.update(); Pkg.instantiate()'"

[tasks.generate-sbom]
depends-on = ["instantiate-julia"]
cmd = "julia --project utils/sbom-generation.jl"
inputs = ["Manifest.toml"]
outputs = ["Wflow.spdx.json"]

[dependencies]
boto3 = "*"
dvc = "*"
dvc-s3 = "*"
julia = { version = "==1.12.7", channel = "https://prefix.dev/julia-forge" }
python = ">=3.10"
jupyter = ">=1.1.1,<2"
quarto = ">=1.8.26,<2"
prek = "*"
typos = "*"
