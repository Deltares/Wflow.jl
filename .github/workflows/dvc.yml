name: DVC consistency
on:
  push:
    branches:
      - main
      - "release/**"

permissions:
  contents: read

jobs:
  status:
    name: Example models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: "latest"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .dvc/cache
          key: dvc-${{ hashFiles('Wflow/test/data/input.dvc') }}
      - name: Download test data
        env:
          CRYPTOGRAPHY_OPENSSL_NO_LEGACY: "1"
        run: pixi run download-test-data
      - name: Check DVC pipeline
        env:
          CRYPTOGRAPHY_OPENSSL_NO_LEGACY: "1"
        run: |
          pixi run dvc status publish-example-models --json > dvc-status.json
          pixi run python -c 'import json, sys; status = json.load(open("dvc-status.json")); print(json.dumps(status, indent=2)); sys.exit(bool(status))'
