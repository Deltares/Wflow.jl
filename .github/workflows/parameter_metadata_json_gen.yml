name: Parameter & variable metadata JSON generation
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ "Wflow/src/standard_name/**" ]
  pull_request:
    paths: [ "Wflow/src/standard_name/**" ]
jobs:
  json_gen:
    name: JSON generation
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          # Put the pixi environment, including julia, on the PATH for later steps
          activate-environment: true
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
      - name: Test parameter metadata JSON generation
        run: |
          pixi run parameter_metadata_json_gen
          pixi run install-prek
          pixi run fix-check
      - name: Ensure that there was no change in the metadata
        run: git diff --exit-code
