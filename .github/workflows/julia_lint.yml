name: Julia Lint
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
jobs:
  julia_lint:
    name: Julia Lint
    runs-on: ubuntu-24.04
    permissions:
      actions: write # Required to allow julia-actions/cache to delete old caches
      contents: read # Required to checkout and read repo files
      security-events: write # Required to upload SARIF files to Security tab
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: julia-actions/cache@a7bed9df697e5d7309d68afe7542a87621a8b6c8 # v3.3.0
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: "latest"
      - name: Install julialint (LintApp.jl)
        run: pixi run install-julialint
      - name: Run julialint
        run: pixi run lint-sarif
      - name: Upload julialint results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: "julialint-results.sarif"
          category: "julialint"
      # SARIF output always exits 0, so fail on error-level findings explicitly
      - name: Fail on julialint errors
        run: |
          jq -r '.runs[].results[] | select(.level == "error")
            | "::error file=\(.locations[0].physicalLocation.artifactLocation.uri),line=\(.locations[0].physicalLocation.region.startLine)::\(.message.text) [\(.ruleId)]"' \
            julialint-results.sarif
          jq -e '[.runs[].results[] | select(.level == "error")] | length == 0' julialint-results.sarif > /dev/null
